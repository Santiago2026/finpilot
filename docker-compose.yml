services:
  backend:
    build:
      context: ./finpilot/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/finpilot.db}
      FINERACT_BASE_URL: ${FINERACT_BASE_URL:-https://fineract-fineract-1:8443/fineract-provider}
      FINERACT_USERNAME: ${FINERACT_USERNAME:-}
      FINERACT_PASSWORD: ${FINERACT_PASSWORD:-}
      FINERACT_TENANT_ID: ${FINERACT_TENANT_ID:-default}
      FINERACT_VERIFY_TLS: ${FINERACT_VERIFY_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-at-least-32-characters}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_URL: ${MCP_URL:-http://127.0.0.1:8000/mcp/}
      MCP_DEV_TOKEN: ${MCP_DEV_TOKEN:-}
      WRITES_ENABLED: ${WRITES_ENABLED:-true}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_URL: ${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL_ID: ${HF_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      HF_PROVIDER: ${HF_PROVIDER:-auto}
      HF_MAX_NEW_TOKENS: ${HF_MAX_NEW_TOKENS:-1024}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-finpilot}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      FINPILOT_API_URL: http://backend:8000/api/v1
      SSL_CERT_FILE: /etc/ssl/certs/finpilot-ca-bundle.pem
    volumes:
      - finpilot_db:/data
      - ./finpilot/backend/docs:/app/docs
      - ${FINERACT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/finpilot-ca-bundle.pem:ro
    networks:
      - app
      - fineract

  dashboard:
    build:
      context: ./finpilot/backend/dashboard
      dockerfile: Dockerfile
    ports:
      - "${FINPILOT_DASHBOARD_PORT:-8502}:8501"
    environment:
      FINPILOT_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - app

volumes:
  finpilot_db:

networks:
  app:
    driver: bridge
  fineract:
    external: true
    name: fineract_default
