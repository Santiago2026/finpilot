services:
  backend:
    build:
      context: ./finpilot/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    env_file:
      - path: ./finpilot/backend/.env
        required: true
    environment:
      FINPILOT_API_URL: http://backend:8000/api/v1
      SSL_CERT_FILE: /etc/ssl/certs/finpilot-ca-bundle.pem
    volumes:
      - finpilot_db:/data
      - ./finpilot/backend/docs:/app/docs
      - ${FINERACT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/finpilot-ca-bundle.pem:ro
    networks:
      - app
      - fineract
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build:
      context: ./finpilot/backend/dashboard
      dockerfile: Dockerfile
    ports:
      - "${FINPILOT_DASHBOARD_PORT:-8502}:8501"
    environment:
      FINPILOT_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - app

volumes:
  finpilot_db:

networks:
  app:
    driver: bridge
  fineract:
    external: true
    name: fineract_default
